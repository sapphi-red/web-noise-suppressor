name: automatic release

on:
  push:
    tags:
      - v*

jobs:
  release:
    name: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-repo
      - name: build
        run: pnpm run build
      - name: deploy
        run: pnpm publish --access public --no-git-checks --provenance
